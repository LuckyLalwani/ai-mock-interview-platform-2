# ============================================================
# Google Cloud Build Pipeline for AI Mock Interview Platform
# ============================================================
steps:
  # ------------------------------------------------------------
  # 1. Build ML Service container image
  # ------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/ml-service:$BUILD_ID'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/ml-service:latest'
      - './ml-service'
    id: 'build-ml-service'

  # ------------------------------------------------------------
  # 2. Push ML Service container image
  # ------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/ml-service:latest'
    id: 'push-ml-service'

  # ------------------------------------------------------------
  # 3. Deploy ML Service to Cloud Run
  # ------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ai-mock-ml-service'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/ml-service:latest'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300s'
      - '--set-env-vars'
      - 'GROQ_API_KEY=$_GROQ_API_KEY'
    id: 'deploy-ml-service'

  # ------------------------------------------------------------
  # 4. Build Frontend container image (injecting ML service URL)
  # ------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_SUPABASE_URL=$_VITE_SUPABASE_URL'
      - '--build-arg'
      - 'VITE_SUPABASE_ANON_KEY=$_VITE_SUPABASE_ANON_KEY'
      - '--build-arg'
      - 'VITE_ML_SERVICE_URL=$_ML_SERVICE_URL'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/frontend:$BUILD_ID'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/frontend:latest'
      - '.'
    id: 'build-frontend'

  # ------------------------------------------------------------
  # 5. Push Frontend container image
  # ------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/frontend:latest'
    id: 'push-frontend'

  # ------------------------------------------------------------
  # 6. Deploy Frontend to Cloud Run
  # ------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ai-mock-frontend'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/frontend:latest'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
    id: 'deploy-frontend'

substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'mock-interview'
  _GROQ_API_KEY: ''
  _VITE_SUPABASE_URL: ''
  _VITE_SUPABASE_ANON_KEY: ''
  _ML_SERVICE_URL: ''

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/ml-service:latest'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/frontend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
